[package]
name = "tools-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "neurox tools engine — tool registry, executor, LLM provider manager. In-process replacement for the old mcps/llmd process."

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true } # EP-0014 C-001: legacy
serde_yml = "0.0.12"

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP client (used by provider test, model discovery, model downloader,
# and the LLM backends' streaming chat). The `stream` feature is needed
# for `Response::bytes_stream()`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# UUIDs (used by LLM backends for message ids)
uuid = { workspace = true }

# Errors
anyhow = { workspace = true }
thiserror = "1"

# Async traits
async-trait = { workspace = true }

# Shared state
parking_lot = { workspace = true }
arc-swap = "1"

# Date/time
chrono = { workspace = true }

# Paths
dirs = { workspace = true }

# F-W2: advisory file locks for write_file race conditions (flock(2))
fs2 = "0.4"

# URL parsing for web_fetch SSRF protection
url = "2"

# Tools (file scanning)
glob = "0.3"
regex = { workspace = true }

# F5.1: SQLite-backed provider CRUD
sqlx = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
