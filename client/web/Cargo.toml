[workspace]
resolver = "2"
members = ["server"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Andres Fernandez <andresfernandezp94@gmail.com>"]

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-br", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
