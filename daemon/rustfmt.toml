# Project-wide rustfmt configuration.
# https://rust-lang.github.io/rustfmt/
#
# Only stable options go here. Nightly-only options stay as defaults.

edition = "2021"
max_width = 100
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true