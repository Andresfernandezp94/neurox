# neurox overlay keybinds for Hyprland
# Add to ~/.config/hypr/hyprland.conf:
#
#   source = ~/.config/neurox/hyprland/keybinds.conf
#
# Or copy/paste the lines below.

# Toggle overlay (1st press: show, 2nd press: hide)

# Quick send to active session (uses notify-send for feedback)
bind = SUPER, Return, exec, notify-send "neurox" "use the TUI or web to send messages"

# Focus the TUI (if running in another terminal)
bind = SUPER ALT, T, exec, foot -e neurox-client-tui ws://127.0.0.1:7878/v1/events brain
